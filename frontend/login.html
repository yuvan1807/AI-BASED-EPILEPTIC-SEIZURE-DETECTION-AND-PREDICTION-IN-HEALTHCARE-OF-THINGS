<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeizureGuard AI - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0f1e;
            color: white;
            overflow-x: hidden;
        }

        /* Live EEG Video Background */
        #live-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.4;
            filter: hue-rotate(140deg) saturate(1.5);
        }

        /* Animated EEG Overlay */
        .eeg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 30% 40%, rgba(0, 255, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(255, 0, 150, 0.15) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Animated EEG Lines Canvas */
        #eegCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: cyan;
            border-radius: 50%;
            box-shadow: 0 0 15px cyan;
            animation: floatParticle 15s linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px;
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(10, 15, 30, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            margin-bottom: 40px;
            animation: slideDown 0.8s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
        }

        .logo i {
            color: cyan;
            font-size: 32px;
            animation: brainPulse 2s ease infinite;
        }

        @keyframes brainPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 20px cyan; }
            50% { transform: scale(1.1); text-shadow: 0 0 40px cyan; }
        }

        .logo span {
            background: linear-gradient(135deg, #fff, cyan);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            padding: 5px 0;
            font-size: 16px;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, cyan, magenta);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::before {
            width: 100%;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-login, .btn-signup {
            padding: 10px 25px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-size: 14px;
        }

        .btn-login {
            background: transparent;
            border: 2px solid cyan;
            color: cyan;
        }

        .btn-signup {
            background: linear-gradient(135deg, cyan, magenta);
            color: white;
        }

        .btn-login:hover, .btn-signup:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.4);
        }

        /* Login Container */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0 60px 0;
        }

        .login-card {
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 50px;
            width: 100%;
            max-width: 500px;
            animation: fadeInUp 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            animation: rotate 15s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .login-header h2 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, cyan);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
        }

        .login-header i {
            font-size: 50px;
            color: cyan;
            margin-bottom: 20px;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Login Form */
        .login-form {
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            color: cyan;
            font-size: 18px;
            z-index: 2;
        }

        .input-wrapper input {
            width: 100%;
            padding: 18px 20px 18px 55px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: cyan;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            background: rgba(0, 255, 255, 0.05);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .toggle-password {
            position: absolute;
            right: 20px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .toggle-password:hover {
            color: cyan;
        }

        /* Form Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: cyan;
        }

        .forgot-password {
            color: cyan;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .forgot-password:hover {
            text-shadow: 0 0 10px cyan;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, cyan, #00aaff);
            border: none;
            border-radius: 30px;
            color: #0a0f1e;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .login-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0, 255, 255, 0.4);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
        }

        .divider span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        /* Social Login */
        .social-login {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: cyan;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: cyan;
            color: #0a0f1e;
            transform: translateY(-5px) rotate(360deg);
            box-shadow: 0 10px 20px rgba(0, 255, 255, 0.3);
        }

        /* Signup Link */
        .signup-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
        }

        .signup-link a {
            color: cyan;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .signup-link a:hover {
            text-shadow: 0 0 10px cyan;
        }

        /* EEG Live Indicator */
        .eeg-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            position: relative;
            z-index: 1;
        }

        .eeg-indicator .live-dot {
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            animation: livePulse 1s ease infinite;
            box-shadow: 0 0 15px #ff0000;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .eeg-indicator .live-text {
            color: #ff0000;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .eeg-indicator .wave {
            flex: 1;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M0,10 Q10,0 20,10 T40,10 T60,10 T80,10 T100,10" stroke="cyan" fill="none" stroke-width="2"/></svg>');
            background-repeat: repeat-x;
            animation: waveMove 2s linear infinite;
            opacity: 0.5;
        }

        @keyframes waveMove {
            from { background-position: 0 0; }
            to { background-position: 50px 0; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 20px;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
            }
            
            .login-card {
                padding: 30px 20px;
            }
            
            .login-header h2 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <!-- Live Video Background -->
    <video id="live-bg" autoplay muted loop playsinline>
        <source src="https://videos.pexels.com/video-files/3121257/3121257-uhd_2560_1440_25fps.mp4" type="video/mp4">
        <source src="https://videos.pexels.com/video-files/2033618/2033618-uhd_2560_1440_25fps.mp4" type="video/mp4">
    </video>

    <!-- EEG Overlay -->
    <div class="eeg-overlay"></div>

    <!-- Animated EEG Canvas -->
    <canvas id="eegCanvas"></canvas>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="logo" onclick="window.location.href='/'">
                <i class="fas fa-brain"></i>
                <span>SeizureGuard AI</span>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="about">About</a>
                <a href="features">Features</a>
                <a href="how-it-works">How It Works</a>
                <a href="contact">Contact</a>
            </div>
            <div class="nav-buttons">
                <button class="btn-login" onclick="window.location.href='login'" style="background: cyan; color: #0a0f1e;">Login</button>
                <button class="btn-signup" onclick="window.location.href='signup'">Sign Up</button>
            </div>
        </nav>

        <!-- Login Container -->
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <i class="fas fa-brain"></i>
                    <h2>Welcome Back</h2>
                    <p>Login to access your EEG analysis dashboard</p>
                </div>

                <form class="login-form" onsubmit="event.preventDefault(); window.location.href='dashboard';">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">
                        <i class="fas fa-sign-in-alt" style="margin-right: 10px;"></i>
                        Login
                    </button>

                    <div class="divider">
                        <div class="divider-line"></div>
                        <span>OR</span>
                        <div class="divider-line"></div>
                    </div>

                    <div class="social-login">
                        <div class="social-btn" onclick="window.location.href='#'">
                            <i class="fab fa-google"></i>
                        </div>
                        <div class="social-btn" onclick="window.location.href='#'">
                            <i class="fab fa-facebook-f"></i>
                        </div>
                        <div class="social-btn" onclick="window.location.href='#'">
                            <i class="fab fa-github"></i>
                        </div>
                        <div class="social-btn" onclick="window.location.href='#'">
                            <i class="fab fa-linkedin-in"></i>
                        </div>
                    </div>

                    <div class="signup-link">
                        Don't have an account? <a href="signup">Sign Up</a>
                    </div>
                </form>

                <!-- EEG Live Indicator -->
                <div class="eeg-indicator">
                    <span class="live-dot"></span>
                    <span class="live-text">LIVE EEG MONITORING</span>
                    <div class="wave"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // EEG Wave Animation on Canvas
        function initEEGCanvas() {
            const canvas = document.getElementById('eegCanvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            let time = 0;
            
            function drawEEGWaves() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for (let wave = 0; wave < 5; wave++) {
                    const yOffset = canvas.height * (0.2 + wave * 0.15);
                    const amplitude = 30 + wave * 10;
                    const frequency = 0.02 + wave * 0.005;
                    
                    ctx.beginPath();
                    ctx.strokeStyle = wave % 2 === 0 ? 'cyan' : 'magenta';
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.3;
                    
                    for (let x = 0; x < canvas.width; x += 5) {
                        const y = yOffset + 
                                 Math.sin(x * frequency + time) * amplitude * 0.5 +
                                 Math.sin(x * frequency * 2 + time * 1.5) * amplitude * 0.3 +
                                 Math.sin(x * frequency * 3 + time * 2) * amplitude * 0.2;
                        
                        if (x === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }
                    
                    ctx.stroke();
                }
                
                time += 0.05;
                requestAnimationFrame(drawEEGWaves);
            }
            
            drawEEGWaves();
        }

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('eegCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            initEEGCanvas();
        });
    </script>
</body>
</html>

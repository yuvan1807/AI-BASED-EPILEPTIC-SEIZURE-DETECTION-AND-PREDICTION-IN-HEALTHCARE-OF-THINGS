<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeizureGuard AI - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0f1e;
            color: white;
            overflow-x: hidden;
        }

        /* Live EEG Video Background */
        #live-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.4;
            filter: hue-rotate(140deg) saturate(1.5);
        }

        /* Animated EEG Overlay */
        .eeg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 30% 40%, rgba(0, 255, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(255, 0, 150, 0.15) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Animated EEG Lines Canvas */
        #eegCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: cyan;
            border-radius: 50%;
            box-shadow: 0 0 15px cyan;
            animation: floatParticle 15s linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px;
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(10, 15, 30, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            margin-bottom: 40px;
            animation: slideDown 0.8s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
        }

        .logo i {
            color: cyan;
            font-size: 32px;
            animation: brainPulse 2s ease infinite;
        }

        @keyframes brainPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 20px cyan; }
            50% { transform: scale(1.1); text-shadow: 0 0 40px cyan; }
        }

        .logo span {
            background: linear-gradient(135deg, #fff, cyan);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            padding: 5px 0;
            font-size: 16px;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, cyan, magenta);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::before {
            width: 100%;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-login, .btn-signup {
            padding: 10px 25px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-size: 14px;
        }

        .btn-login {
            background: transparent;
            border: 2px solid cyan;
            color: cyan;
        }

        .btn-signup {
            background: linear-gradient(135deg, cyan, magenta);
            color: white;
        }

        .btn-login:hover, .btn-signup:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.4);
        }

        /* Signup Container */
        .signup-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0 60px 0;
        }

        .signup-card {
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 50px;
            width: 100%;
            max-width: 550px;
            animation: fadeInUp 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        .signup-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            animation: rotate 15s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signup-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .signup-header h2 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, cyan);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .signup-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
        }

        .signup-header i {
            font-size: 50px;
            color: cyan;
            margin-bottom: 20px;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Signup Form */
        .signup-form {
            position: relative;
            z-index: 1;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            color: cyan;
            font-size: 16px;
            z-index: 2;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-wrapper select {
            appearance: none;
            cursor: pointer;
        }

        .input-wrapper select option {
            background: #0a0f1e;
            color: white;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            outline: none;
            border-color: cyan;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            background: rgba(0, 255, 255, 0.05);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .toggle-password {
            position: absolute;
            right: 20px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .toggle-password:hover {
            color: cyan;
        }

        /* Terms Checkbox */
        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 25px 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .terms-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: cyan;
        }

        .terms-checkbox a {
            color: cyan;
            text-decoration: none;
        }

        .terms-checkbox a:hover {
            text-decoration: underline;
        }

        /* Signup Button */
        .signup-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, cyan, magenta);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .signup-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .signup-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .signup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(255, 0, 150, 0.4);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
        }

        .divider span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        /* Social Signup */
        .social-signup {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: cyan;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: cyan;
            color: #0a0f1e;
            transform: translateY(-5px) rotate(360deg);
            box-shadow: 0 10px 20px rgba(0, 255, 255, 0.3);
        }

        /* Login Link */
        .login-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
        }

        .login-link a {
            color: cyan;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            text-shadow: 0 0 10px cyan;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 10px;
            display: flex;
            gap: 5px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .strength-bar.active {
            background: cyan;
            box-shadow: 0 0 10px cyan;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 20px;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
            }
            
            .signup-card {
                padding: 30px 20px;
            }
            
            .signup-header h2 {
                font-size: 28px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Live Video Background -->
    <video id="live-bg" autoplay muted loop playsinline>
        <source src="https://videos.pexels.com/video-files/3121257/3121257-uhd_2560_1440_25fps.mp4" type="video/mp4">
        <source src="https://videos.pexels.com/video-files/2033618/2033618-uhd_2560_1440_25fps.mp4" type="video/mp4">
    </video>

    <!-- EEG Overlay -->
    <div class="eeg-overlay"></div>

    <!-- Animated EEG Canvas -->
    <canvas id="eegCanvas"></canvas>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="logo" onclick="window.location.href='/'">
                <i class="fas fa-brain"></i>
                <span>SeizureGuard AI</span>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="about">About</a>
                <a href="features">Features</a>
                <a href="how-it-works">How It Works</a>
                <a href="contact">Contact</a>
            </div>
            <div class="nav-buttons">
                <button class="btn-login" onclick="window.location.href='login'">Login</button>
                <button class="btn-signup" onclick="window.location.href='signup'" style="background: linear-gradient(135deg, cyan, magenta);">Sign Up</button>
            </div>
        </nav>

        <!-- Signup Container -->
        <div class="signup-container">
            <div class="signup-card">
                <div class="signup-header">
                    <i class="fas fa-brain"></i>
                    <h2>Create Account</h2>
                    <p>Join SeizureGuard AI for early seizure detection</p>
                </div>

                <form class="signup-form" onsubmit="event.preventDefault(); window.location.href='dashboard';">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" placeholder="John" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Last Name</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" placeholder="Doe" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" placeholder="john.doe@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone-alt input-icon"></i>
                            <input type="tel" placeholder="+1 (555) 123-4567" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="password" placeholder="Create password" required onkeyup="checkPasswordStrength()">
                                <i class="fas fa-eye toggle-password" onclick="togglePassword('password')"></i>
                            </div>
                            <div class="password-strength" id="strengthBars">
                                <div class="strength-bar"></div>
                                <div class="strength-bar"></div>
                                <div class="strength-bar"></div>
                                <div class="strength-bar"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Confirm Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                                <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword')"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Account Type</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user-md input-icon"></i>
                            <select required>
                                <option value="" disabled selected>Select account type</option>
                                <option value="patient">Patient</option>
                                <option value="doctor">Healthcare Professional</option>
                                <option value="researcher">Researcher</option>
                                <option value="hospital">Hospital/Institution</option>
                            </select>
                        </div>
                    </div>

                    <div class="terms-checkbox">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                    </div>

                    <button type="submit" class="signup-btn">
                        <i class="fas fa-user-plus" style="margin-right: 10px;"></i>
                        Create Account
                    </button>

                    <div class="divider">
                        <div class="divider-line"></div>
                        <span>OR</span>
                        <div class="divider-line"></div>
                    </div>

                    <div class="social-signup">
                        <div class="social-btn" onclick="window.location.href='#'">
                            <i class="fab fa-google"></i>
                        </div>
                        <div class="social-btn" onclick="window.location.href='#'">
                            <i class="fab fa-facebook-f"></i>
                        </div>
                        <div class="social-btn" onclick="window.location.href='#'">
                            <i class="fab fa-github"></i>
                        </div>
                        <div class="social-btn" onclick="window.location.href='#'">
                            <i class="fab fa-linkedin-in"></i>
                        </div>
                    </div>

                    <div class="login-link">
                        Already have an account? <a href="login">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // EEG Wave Animation on Canvas
        function initEEGCanvas() {
            const canvas = document.getElementById('eegCanvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            let time = 0;
            
            function drawEEGWaves() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for (let wave = 0; wave < 5; wave++) {
                    const yOffset = canvas.height * (0.2 + wave * 0.15);
                    const amplitude = 30 + wave * 10;
                    const frequency = 0.02 + wave * 0.005;
                    
                    ctx.beginPath();
                    ctx.strokeStyle = wave % 2 === 0 ? 'cyan' : 'magenta';
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = 0.3;
                    
                    for (let x = 0; x < canvas.width; x += 5) {
                        const y = yOffset + 
                                 Math.sin(x * frequency + time) * amplitude * 0.5 +
                                 Math.sin(x * frequency * 2 + time * 1.5) * amplitude * 0.3 +
                                 Math.sin(x * frequency * 3 + time * 2) * amplitude * 0.2;
                        
                        if (x === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }
                    
                    ctx.stroke();
                }
                
                time += 0.05;
                requestAnimationFrame(drawEEGWaves);
            }
            
            drawEEGWaves();
        }

        // Toggle password visibility
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleIcon = event.target;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Check password strength
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const bars = document.querySelectorAll('#strengthBars .strength-bar');
            
            // Reset bars
            bars.forEach(bar => {
                bar.classList.remove('active');
                bar.style.background = 'rgba(255, 255, 255, 0.1)';
            });
            
            if (password.length === 0) return;
            
            let strength = 0;
            
            // Length check
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            
            // Character type checks
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            // Update bars
            for (let i = 0; i < strength && i < bars.length; i++) {
                bars[i].classList.add('active');
                if (strength <= 2) {
                    bars[i].style.background = '#ff4444';
                } else if (strength <= 4) {
                    bars[i].style.background = '#ffaa00';
                } else {
                    bars[i].style.background = '#00ff88';
                }
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('eegCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            initEEGCanvas();
        });
    </script>
</body>
</html>
